<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ดาวน์โหลดฟ้าฝน</title>
<meta name="description" content="ฟ้าฝน แอปดูฝุ่น PM2.5 ฝน และระดับน้ำ ดาวน์โหลดสำหรับ iPhone และ Android">
<meta name="robots" content="noindex">
<meta property="og:title" content="ฟ้าฝน - พยากรณ์อากาศ PM2.5">
<meta property="og:description" content="เช็กฝุ่น ฝน และระดับน้ำ ในแอปเดียว">
<style>
  :root {
    --bg: #eef4fb; --card: #ffffff; --ink: #14233a; --muted: #5b6b82;
    --accent: #2f6fde; --accent-ink: #ffffff; --line: #d6e0ee;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1a2b; --card: #17263c; --ink: #eaf1fb; --muted: #9db0c9;
      --accent: #5b92f0; --accent-ink: #0b1626; --line: #2a3d58;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: var(--bg); color: var(--ink);
    font-family: "IBM Plex Sans Thai Looped", "Sarabun", system-ui, -apple-system, "Segoe UI", sans-serif;
    line-height: 1.55; padding: 16px;
  }
  main {
    width: 100%; max-width: 420px; background: var(--card);
    border: 1px solid var(--line); border-radius: 20px; padding: 28px 24px; text-align: center;
  }
  h1 { font-size: 1.6rem; margin: 0 0 4px; }
  p.sub { margin: 0 0 22px; color: var(--muted); }
  a.btn {
    display: block; padding: 14px 16px; margin: 10px 0; border-radius: 12px;
    background: var(--accent); color: var(--accent-ink); text-decoration: none; font-weight: 600;
  }
  a.btn.secondary { background: transparent; color: var(--ink); border: 1px solid var(--line); }
  span.soon { display: block; padding: 14px 16px; margin: 10px 0; border-radius: 12px;
    border: 1px dashed var(--line); color: var(--muted); }
  p.note { font-size: .85rem; color: var(--muted); margin: 18px 0 0; }
  p.note a { color: inherit; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <h1>ฟ้าฝน</h1>
  <p class="sub">เช็กฝุ่น ฝน และระดับน้ำ ก่อนออกจากบ้าน</p>

  <div id="ios-block">
    <a id="ios-link" class="btn" href="#" hidden>ดาวน์โหลดบน App Store (iPhone)</a>
    <span id="ios-soon" class="soon" hidden>เวอร์ชัน iPhone เร็วๆ นี้</span>
  </div>
  <div id="android-block">
    <a id="android-link" class="btn" href="#">ดาวน์โหลดบน Google Play (Android)</a>
  </div>

  <p class="note">
    <a href="https://poommipatme-ctrl.github.io/privacy-policy.html">นโยบายความเป็นส่วนตัว</a> ·
    <a href="https://poommipatme-ctrl.github.io/terms-of-use.html">ข้อกำหนดการใช้งาน</a>
  </p>
</main>

<script>
  // ---- Edit these two values only ------------------------------------------
  // Leave IOS_URL empty until the app is live on the App Store; the page then
  // shows "iPhone version coming soon" instead of a dead link.
  // When the app goes live, set it to: 'https://apps.apple.com/th/app/id6820408410'
  var IOS_URL = '';
  var ANDROID_URL = 'https://play.google.com/store/apps/details?id=th.co.infra.weatheraqi';
  // ---------------------------------------------------------------------------

  (function () {
    var ua = navigator.userAgent || '';
    // iPadOS Safari reports itself as a Mac, so touch support is the tell.
    var isIOS = /iPhone|iPad|iPod/i.test(ua) ||
      (/Macintosh/i.test(ua) && navigator.maxTouchPoints > 1);
    var isAndroid = /Android/i.test(ua);

    var iosLink = document.getElementById('ios-link');
    var iosSoon = document.getElementById('ios-soon');
    var androidLink = document.getElementById('android-link');

    androidLink.href = ANDROID_URL;
    if (IOS_URL) {
      iosLink.href = IOS_URL;
      iosLink.hidden = false;
    } else {
      iosSoon.hidden = false;
    }

    // On a phone, show only that platform's button and go straight to the store.
    // On desktop both buttons stay visible and nothing redirects.
    if (isIOS) {
      document.getElementById('android-block').hidden = true;
      if (IOS_URL) location.replace(IOS_URL);
    } else if (isAndroid) {
      document.getElementById('ios-block').hidden = true;
      location.replace(ANDROID_URL);
    }
  })();
</script>
<noscript>
  <p style="text-align:center">
    <a href="https://play.google.com/store/apps/details?id=th.co.infra.weatheraqi">Google Play (Android)</a>
  </p>
</noscript>
</body>
</html>
